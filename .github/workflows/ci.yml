name: CI

# Phase 3 added build + test. Phase 4 added Gitleaks secrets scanning.
# Phase 5 added Semgrep SAST. Phase 6 added dependency/SCA scanning.
# Phase 7 added container image scanning (inside docker-build). Phase 8
# added the policy-as-code gate below. Deployment still comes later.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Postgres is available to every step below (DATABASE_URL points at it).
    # No integration tests exist yet, but this keeps the job ready for the
    # ones added in a later phase without needing a workflow change.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: govault_ci
          POSTGRES_PASSWORD: govault_ci_password
          POSTGRES_DB: govault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govault_ci -d govault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test-only credentials for the ephemeral CI Postgres container above —
      # not real secrets, and this database is destroyed when the job ends.
      DATABASE_URL: postgres://govault_ci:govault_ci_password@localhost:5432/govault_test?sslmode=disable
      PORT: 8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Generate dummy CI keys (not production values)
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PASETO_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build (go build ./...)
        run: go build ./...

      - name: Vet (go vet ./...)
        run: go vet ./...

      - name: Check for test files
        id: has_tests
        run: |
          if find . -name '*_test.go' -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test (go test ./...)
        if: steps.has_tests.outputs.found == 'true'
        run: go test ./... -v

      - name: No tests yet
        if: steps.has_tests.outputs.found == 'false'
        run: |
          echo "::notice::No _test.go files found yet — skipping go test. Expected for Phase 3; add tests in a later phase."
          {
            echo "### ℹ️ Tests"
            echo "No \`*_test.go\` files exist yet, so \`go test ./...\` was skipped."
            echo "This is expected at this phase — build and vet still ran and gated the job."
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    # No `needs:` — runs in parallel with the other jobs. Image scanning is
    # done in THIS job (Phase 7), not a separate one with `needs: docker-build`
    # — the built image only exists in this runner's local Docker daemon
    # (load: true below), and a separate job runs on a fresh VM with no access
    # to it. Splitting it out would mean docker save/upload-artifact/
    # download-artifact/docker load just to hand the image across, for a
    # tightly-coupled "scan the thing we just built" step. Not worth it here.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed anywhere)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true # load into the local Docker daemon so we can inspect its size below
          tags: govault:ci

      - name: Report image size
        run: |
          BYTES=$(docker image inspect govault:ci --format='{{.Size}}')
          MB=$(awk "BEGIN { printf \"%.2f\", $BYTES/1024/1024 }")
          echo "Image size: ${MB} MB (${BYTES} bytes)"
          {
            echo "### 🐳 Docker image size"
            echo ""
            echo "\`govault:ci\` = **${MB} MB** (${BYTES} bytes)"
            echo ""
            echo '```'
            docker images govault:ci
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan built image for OS package vulnerabilities (Trivy)
        # scan-type: image (not fs, which is Phase 6's job — that scanned our
        # Go module dependencies as source). This scans the actual BUILT
        # image: base OS packages and layers. `scanners: misconfig` is also
        # enabled for completeness (catches IaC files accidentally baked into
        # a layer), though empirically it does NOT evaluate an image's
        # runtime USER field — see the dedicated step below for that.
        id: trivy-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: govault:ci
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Verify container runs as non-root (real built image, not Dockerfile text)
        # Trivy's `misconfig` scanner in image mode only checks for IaC files
        # embedded IN the image filesystem (Dockerfiles/k8s manifests/etc.
        # baked into a layer) — verified empirically that it does NOT
        # evaluate an image's actual runtime USER field: scanning a
        # known-root-by-default public image (no USER set at all) still
        # reports misconfig as "not scanned", identical to a correctly
        # non-root image. So rather than rely on a misconfig finding that
        # doesn't actually fire either way, we read the real, post-build USER
        # straight from the image's own config metadata via `docker inspect`
        # — this reflects what the built image actually runs as, not what
        # the Dockerfile merely declares.
        id: nonroot-check
        continue-on-error: true
        run: |
          USER_ID=$(docker inspect --format='{{.Config.User}}' govault:ci)
          echo "Image USER: '${USER_ID}'"
          if [ -z "$USER_ID" ] || [ "$USER_ID" = "0" ] || [ "$USER_ID" = "0:0" ] || [ "$USER_ID" = "root" ]; then
            echo "::error::Container image is NOT configured to run as non-root (USER='${USER_ID}')"
            exit 1
          fi
          echo "::notice::Container correctly runs as non-root (USER='${USER_ID}')"

      - name: Fail the job if the image scan or non-root check found something
        if: steps.trivy-image.outcome == 'failure' || steps.nonroot-check.outcome == 'failure'
        run: |
          echo "::error::trivy-image outcome=${{ steps.trivy-image.outcome }}, nonroot-check outcome=${{ steps.nonroot-check.outcome }}"
          exit 1

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    # No `needs:` — runs in parallel with build-and-test and docker-build so a
    # clean commit isn't held up waiting on the other jobs, and vice versa.
    steps:
      - name: Checkout code (full history for commit-range diffing)
        uses: actions/checkout@v4
        with:
          # gitleaks-action resolves the exact commit range for the push/PR
          # event (event.before..event.after, or PR base..head) and needs
          # those commits present locally to diff — hence full history here.
          # This does NOT mean gitleaks scans the whole history for secrets;
          # it only scans the commits introduced by this push/PR.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    # Semgrep's own image ships the CLI pre-installed — simpler and gives
    # explicit control over which rule packs run than the marketplace
    # semgrep-action, which is oriented around Semgrep's paid SaaS platform
    # (expects a SEMGREP_APP_TOKEN). We don't have or need one for this.
    container:
      image: semgrep/semgrep
    # No `needs:` — runs in parallel with the other three jobs.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep (Go default + security-audit rules)
        # p/secrets is deliberately NOT included: Gitleaks already runs as its
        # own dedicated job for that exact category (hardcoded credentials),
        # so adding Semgrep's secrets ruleset here would just duplicate the
        # same findings. This job instead targets code-level vulnerability
        # *patterns* Gitleaks never looks for at all — SQL injection, weak
        # crypto usage, unsafe deserialization, etc.
        #
        # --error: exit non-zero if there are any findings, so this step (and
        # therefore the job) fails on a real hit. See PR/commit description
        # for the blocking-vs-report-only tradeoff and why blocking was
        # chosen here.
        run: |
          semgrep scan \
            --config p/golang \
            --config p/security-audit \
            --error \
            .

  dependency-scan:
    name: Dependency Scan (govulncheck + Trivy)
    runs-on: ubuntu-latest
    # No `needs:` — runs in parallel with the other four jobs.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # govulncheck does call-graph reachability analysis on top of the Go
        # vulnerability database (vuln.go.dev): it only flags a CVE if our
        # code actually calls into the vulnerable code path, not merely
        # because a vulnerable version happens to sit somewhere in go.sum.
        # That makes it far lower-noise than a naive "is this version ever
        # vulnerable" dependency-list scan, which would also flag transitive
        # dependencies our code never touches. Exits non-zero on any finding
        # (govulncheck already only reports genuinely reachable vulns, so no
        # extra severity filtering is needed here).
        #
        # continue-on-error: so a failure here doesn't skip the Trivy step
        # below — both tools' findings should always be visible in the log,
        # not just whichever one happens to run first. The job is still
        # failed explicitly by the final step if either tool found anything.
        id: govulncheck
        continue-on-error: true
        run: govulncheck ./...

      - name: Run Trivy (filesystem/dependency scan)
        # Trivy's vulnerability DB is broader than govulncheck's (which is
        # Go-specific and reachability-scoped), so this is a complementary
        # second layer, not pure duplication — it flags a known-vulnerable
        # version straight from go.mod/go.sum even when govulncheck's
        # reachability analysis can't establish a call path. `scanners: vuln`
        # scopes this to vulnerabilities only: Trivy can also scan for
        # secrets and misconfig, but Gitleaks already owns secrets scanning
        # as its own dedicated job, so enabling that here would just
        # duplicate findings.
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Fail the job if either tool found something
        if: steps.govulncheck.outcome == 'failure' || steps.trivy.outcome == 'failure'
        run: |
          echo "::error::govulncheck outcome=${{ steps.govulncheck.outcome }}, trivy outcome=${{ steps.trivy.outcome }}"
          exit 1

  policy-check:
    name: Policy Check (Conftest/OPA)
    runs-on: ubuntu-latest
    # Conftest's own image ships the binary pre-installed — same pattern as
    # the Semgrep job (much faster than `go install`-ing it fresh every run).
    container:
      image: openpolicyagent/conftest:v0.69.0
    # No `needs:` — runs in parallel with the other five jobs.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Evaluate Dockerfile against policy (Rego, /policy)
        # Policy-as-code: explicit, declarative rules this project's
        # Dockerfile must satisfy, on top of (not instead of) the
        # vulnerability/secret/SAST scanners in the earlier jobs. See
        # /policy/*.rego for what each rule enforces and why. Several of
        # them (ADD vs COPY, no installs in the final stage, HEALTHCHECK
        # required) check things none of the other jobs look at *at all* —
        # Dockerfile instruction semantics, not CVEs, secret byte patterns,
        # or Go source code. See no_add.rego specifically for why that one
        # is the clearest example of this layer's distinct value.
        run: conftest test --parser dockerfile --policy policy Dockerfile
